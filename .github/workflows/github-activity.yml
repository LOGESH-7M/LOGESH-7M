name: Update GitHub Activity

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity SVG
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_USER: LOGESH-7M
        run: |
          python - <<'PY'
          import json, os, urllib.request

          query = '''
          query($login:String!) {
            user(login:$login) {
              contributionsCollection {
                contributionCalendar { totalContributions }
                totalCommitContributions
              }
            }
          }
          '''

          body = json.dumps({
              "query": query,
              "variables": {"login": os.environ["GITHUB_USER"]}
          }).encode()

          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=body,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "LOGESH-7M-profile"
              },
              method="POST",
          )

          with urllib.request.urlopen(req) as response:
              payload = json.load(response)

          data = payload["data"]["user"]["contributionsCollection"]
          contributions = data["contributionCalendar"]["totalContributions"]
          commits = data["totalCommitContributions"]

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170">
          <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#4dd9ff"/><stop offset="1" stop-color="#9b7cff"/></linearGradient></defs>
          <rect width="1200" height="170" rx="22" fill="#0b0f14"/>
          <rect x="28" y="28" width="1144" height="114" rx="16" fill="#111923" stroke="#23344b"/>
          <text x="62" y="65" fill="#7f96b3" font-family="Arial" font-size="14" letter-spacing="3">GITHUB ACTIVITY</text>
          <text x="62" y="108" fill="#f4f7fb" font-family="Arial" font-size="34" font-weight="700">{contributions}</text>
          <text x="62" y="130" fill="#8fa5bf" font-family="Arial" font-size="13">CONTRIBUTIONS</text>
          <line x1="390" y1="52" x2="390" y2="124" stroke="#2b3d54"/>
          <text x="450" y="108" fill="#f4f7fb" font-family="Arial" font-size="34" font-weight="700">{commits}</text>
          <text x="450" y="130" fill="#8fa5bf" font-family="Arial" font-size="13">COMMIT CONTRIBUTIONS</text>
          <circle cx="1060" cy="85" r="34" fill="none" stroke="url(#g)" stroke-width="5"/>
          <circle cx="1060" cy="85" r="6" fill="#4dd9ff"/>
          <text x="1060" y="138" text-anchor="middle" fill="#5b9cff" font-family="Arial" font-size="11" letter-spacing="2">LIVE</text>
          </svg>'''

          open("assets/github-activity.svg", "w", encoding="utf-8").write(svg)
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub activity"
          git push

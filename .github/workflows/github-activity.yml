name: Update GitHub Activity

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate activity SVG
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_USER: LOGESH-7M
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import sys
          from datetime import datetime, timezone, timedelta

          query = '''
          query($login:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$login) {
              login
              contributionsCollection(from:$from, to:$to) {
                contributionCalendar {
                  totalContributions
                }
                totalCommitContributions
              }
            }
          }
          '''

          now = datetime.now(timezone.utc)
          one_year_ago = now - timedelta(days=365)

          variables = {
              "login": os.environ["GITHUB_USER"],
              "from": one_year_ago.isoformat().replace("+00:00", "Z"),
              "to": now.isoformat().replace("+00:00", "Z"),
          }

          body = json.dumps({
              "query": query,
              "variables": variables
          }).encode()

          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=body,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "LOGESH-7M-profile"
              },
              method="POST",
          )

          with urllib.request.urlopen(req) as response:
              payload = json.load(response)

          print("=== GitHub GraphQL response check ===")

          if "errors" in payload:
              print(json.dumps(payload["errors"], indent=2))
              sys.exit("GraphQL returned errors")

          user = payload["data"]["user"]

          if not user:
              sys.exit("GitHub user not found")

          data = user["contributionsCollection"]

          contributions = data["contributionCalendar"]["totalContributions"]
          commits = data["totalCommitContributions"]

          print(f"User: {user['login']}")
          print(f"Contributions: {contributions}")
          print(f"Commit contributions: {commits}")

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 760 125"
              width="760"
              height="125">

            <defs>
              <linearGradient id="line" x1="0" x2="1">
                <stop offset="0" stop-color="#5B9CFF"/>
                <stop offset="1" stop-color="#8B7CFF"/>
              </linearGradient>
            </defs>

            <rect
              x="1"
              y="1"
              width="758"
              height="123"
              rx="18"
              fill="#0B0F14"
              stroke="#1F3047"
              stroke-width="2"/>

            <line
              x1="380"
              y1="25"
              x2="380"
              y2="100"
              stroke="#24364D"
              stroke-width="1"/>

            <text
              x="190"
              y="58"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="32"
              font-weight="700"
              fill="#F4F7FB">{contributions}</text>

            <text
              x="190"
              y="82"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="11"
              font-weight="700"
              letter-spacing="2.5"
              fill="#7F96B3">CONTRIBUTIONS</text>

            <text
              x="570"
              y="58"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="32"
              font-weight="700"
              fill="#F4F7FB">{commits}</text>

            <text
              x="570"
              y="82"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="11"
              font-weight="700"
              letter-spacing="2.5"
              fill="#7F96B3">COMMITS</text>

            <rect
              x="145"
              y="100"
              width="90"
              height="2"
              rx="1"
              fill="url(#line)"/>

            <rect
              x="525"
              y="100"
              width="90"
              height="2"
              rx="1"
              fill="url(#line)"/>

          </svg>'''

          with open(
              "assets/github-activity.svg",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(svg)

          print("SVG generated successfully.")

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-activity.svg

          if git diff --cached --quiet; then
            echo "No activity change detected."
          else
            git commit -m "chore: update GitHub activity"
            git push
          fi
